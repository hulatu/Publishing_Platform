<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="文章分发台">
  <title>文章分发台</title>
  <rect width="512" height="512" rx="112" fill="#C0392B"/>
  <!-- 纸张：右上角切掉一块，再用半透明三角表示折过来的那一面 -->
  <path
    d="M148 104 H288 L380 196 V392 A16 16 0 0 1 364 408 H148 A16 16 0 0 1 132 392 V120 A16 16 0 0 1 148 104 Z"
    fill="#FFFFFF"
  />
  <path d="M288 104 L380 196 H288 Z" fill="#C0392B" opacity="0.55"/>
  <!-- 三条正文行，暗示这是「文章」而不是空白文档 -->
  <g fill="#C0392B" opacity="0.85">
    <rect x="172" y="228" width="168" height="22" rx="11"/>
    <rect x="172" y="278" width="168" height="22" rx="11"/>
    <rect x="172" y="328" width="104" height="22" rx="11"/>
  </g>
</svg>

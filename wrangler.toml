# Cloudflare Pages 项目配置
# 用 wrangler 命令行直接上传时读这个文件；用面板「连接 Git」建的项目
# 不读这里，构建命令和输出目录在面板里配。

name = "hulatu-publish"
pages_build_output_dir = "dist"
compatibility_date = "2026-01-01"

# ---------------------------------------------------------------------------
# 图床（可选）：functions/api/upload.ts 用这个绑定存图
#
# 不配也能正常构建和运行 —— 只是「上传到 R2」那条路会返回 501，
# 前端会翻译成「R2 没绑定，去后台加一个名为 IMAGES 的绑定」。
#
# 三样东西要对上：
#   1. 下面的 binding 名字必须是 IMAGES（代码里写的是 env.IMAGES）
#   2. bucket_name 换成你自己建的 bucket
#   3. 环境变量 UPLOAD_TOKEN 设成和设置面板里填的口令一致
#      不设的话接口会拒绝所有上传 —— 公开的图床接口第二天就会被扫到
#
# 取消注释后本地 `wrangler pages dev dist` 也能用；用面板建的项目
# 请在 Cloudflare 后台 Pages → Settings → Functions → R2 bindings 里加。
# ---------------------------------------------------------------------------
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "article-dispatch-images"

# 图片的公开地址前缀。配了以后返回 `https://你的域名/<key>`，
# 不配则走 /api/upload?key=<key> 这个读回通道（能用，但地址很长、
# 而且依赖 Functions 的免费额度）。建议绑一个自定义域名。
# [vars]
# UPLOAD_PUBLIC_BASE = "https://img.example.com"
